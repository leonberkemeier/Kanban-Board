# Example Caddy configuration for Kanban Board
# Add this to your Caddyfile on your server

# Replace 'kanban.yourdomain.com' with your actual domain
kanban.yourdomain.com {
    # Reverse proxy to the Docker container
    reverse_proxy localhost:8001
    
    # Enable compression
    encode gzip
    
    # Security headers
    header {
        # Prevent XSS attacks
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        X-XSS-Protection "1; mode=block"
        
        # Enable HSTS (optional)
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    }
    
    # Optional: Rate limiting
    # rate_limit {
    #     zone static 10r/s
    # }
    
    # Logs (optional)
    log {
        output file /var/log/caddy/kanban.log
        format console
    }
}

# Alternative: If you want to serve it under a path instead of subdomain
# yourdomain.com {
#     handle_path /kanban/* {
#         reverse_proxy localhost:8001
#     }
# }