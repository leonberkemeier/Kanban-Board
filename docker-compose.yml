version: '3.8'

services:
  # Django backend
  backend:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8001:8000"
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/tasks/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  static_volume:
